[workspace]
members = [
    "harness",
    "contracts/hello/rust",
    "contracts/increment/rust",
    "contracts/token/rust",
]
default-members = ["harness"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "28.0.0"
soroban-token-sdk = "28.0.0"

# The release profile used by every stellar/soroban-examples contract. Note
# `overflow-checks = true`: Rust contracts trap on integer overflow, which
# is why the Zig side is also measured with safety checks on (ReleaseSafe).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
